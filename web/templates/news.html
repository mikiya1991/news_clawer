<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新闻雷达 - Tweet Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <a href="/" class="text-gray-500 hover:text-gray-700 flex items-center">
                        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                        </svg>
                    </a>
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">📡 新闻雷达</h1>
                        <p class="text-sm text-gray-500 mt-1">RSS + X 新闻 · DeepSeek 质量评分</p>
                    </div>
                </div>
                <div class="flex items-center space-x-6">
                    <a href="/timeline" class="text-sm font-medium text-blue-600 hover:text-blue-800">
                        🗓 时间线
                    </a>
                    <a href="/scheduler" class="text-sm font-medium text-blue-600 hover:text-blue-800 flex items-center space-x-1">
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <span>控制台</span>
                    </a>
                    <div id="stats-container" class="hidden md:flex items-center space-x-6 text-sm">
                        <div class="flex items-center">
                            <span class="text-gray-500">总数:</span>
                            <span id="stat-total" class="ml-1 font-semibold text-blue-600">-</span>
                        </div>
                        <div class="flex items-center">
                            <span class="text-gray-500">平均分:</span>
                            <span id="stat-avg" class="ml-1 font-semibold text-green-600">-</span>
                        </div>
                        <div class="flex items-center">
                            <span class="text-gray-500">已推送:</span>
                            <span id="stat-pushed" class="ml-1 font-semibold text-pink-600">-</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Filters & Controls -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4">
            <div class="flex flex-col md:flex-row md:items-center gap-4">
                <!-- Source Filter -->
                <div class="w-full md:w-40">
                    <select id="source-filter" class="w-full py-2 px-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="">全部来源</option>
                        <option value="rss">RSS</option>
                        <option value="x">X 推文</option>
                    </select>
                </div>

                <!-- Min Score Filter -->
                <div class="w-full md:w-40">
                    <select id="min-score-filter" class="w-full py-2 px-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="">最低分不限</option>
                        <option value="80">≥ 80 分</option>
                        <option value="70">≥ 70 分</option>
                        <option value="60">≥ 60 分</option>
                        <option value="40">≥ 40 分</option>
                    </select>
                </div>

                <!-- Pushed Filter -->
                <div class="flex items-center space-x-2">
                    <input type="checkbox" id="pushed-filter" class="h-4 w-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                    <label for="pushed-filter" class="text-sm text-gray-700">仅看已推送</label>
                </div>

                <!-- Sort Options -->
                <div class="flex items-center gap-2 md:ml-auto">
                    <select id="sort-by" class="py-2 px-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                        <option value="score">按评分</option>
                        <option value="time">按时间</option>
                    </select>
                    <button id="sort-order" class="p-2 border border-gray-300 rounded-lg hover:bg-gray-100" title="切换排序方向">
                        <svg id="sort-icon" class="h-5 w-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- News List -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-8">
        <div id="news-container" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3">
            <!-- Loading State -->
            <div class="text-center py-12">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-500 border-t-transparent"></div>
                <p class="mt-4 text-gray-500">加载中...</p>
            </div>
        </div>

        <!-- Pagination -->
        <div id="pagination" class="mt-8 flex items-center justify-between border-t border-gray-200 pt-4 hidden">
            <div class="flex items-center">
                <span class="text-sm text-gray-700">
                    显示 <span id="page-start" class="font-medium">1</span> 到 <span id="page-end" class="font-medium">50</span> 条，
                    共 <span id="page-total" class="font-medium">0</span> 条
                </span>
            </div>
            <div class="flex items-center space-x-2">
                <button id="prev-page" class="px-3 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                    上一页
                </button>
                <span id="page-info" class="text-sm text-gray-700">第 1 页 / 共 1 页</span>
                <button id="next-page" class="px-3 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                    下一页
                </button>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/news.js') }}"></script>
</body>
</html>
