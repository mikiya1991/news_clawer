<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>控制台 - Tweet Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <a href="/" class="text-gray-500 hover:text-gray-700 flex items-center">
                        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                        </svg>
                    </a>
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">控制台</h1>
                        <p class="text-sm text-gray-500 mt-1">采集调度与新闻管理</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/news" class="text-sm font-medium text-blue-600 hover:text-blue-800">
                        📡 新闻雷达
                    </a>
                    <a href="/timeline" class="text-sm font-medium text-blue-600 hover:text-blue-800">
                        🗓 时间线
                    </a>
                    <div id="status-indicator" class="flex items-center space-x-2">
                        <span class="w-3 h-3 rounded-full bg-gray-400"></span>
                        <span class="text-sm text-gray-600">加载中...</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex gap-6">
            <!-- Sidebar Navigation -->
            <aside class="w-52 shrink-0">
                <nav class="bg-white rounded-lg shadow-sm border border-gray-200 p-3 sticky top-24">
                    <div class="text-xs text-gray-400 px-3 pb-2">导航</div>
                    <button type="button" class="tab-btn w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium mb-1 bg-blue-50 text-blue-700" data-tab="status">
                        ⏱ 定时任务状态
                    </button>
                    <button type="button" class="tab-btn w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium mb-1 text-gray-600 hover:bg-gray-50" data-tab="tweets">
                        📥 抓取Tweet记录
                    </button>
                    <button type="button" class="tab-btn w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50" data-tab="news">
                        📡 抓取新闻记录
                    </button>
                    <button type="button" class="tab-btn w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-50" data-tab="config">
                        ⚙️ 系统配置
                    </button>
                </nav>
            </aside>

            <!-- Tab Content -->
            <div class="flex-1 min-w-0">
                <!-- Tab 1: Scheduler Status -->
                <section id="tab-status" class="tab-panel">
                    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 max-w-xl">
                        <h2 class="text-lg font-semibold text-gray-900 mb-4 flex items-center">
                            <svg class="h-5 w-5 mr-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            </svg>
                            定时任务状态
                        </h2>

                        <!-- Status Display -->
                        <div class="mb-6 p-4 bg-gray-50 rounded-lg">
                            <div class="text-sm text-gray-500 mb-1">当前状态</div>
                            <div id="status-text" class="text-lg font-semibold text-gray-900">-</div>
                            <div id="next-run-text" class="text-sm text-gray-500 mt-1">-</div>
                        </div>

                        <!-- Configuration Form -->
                        <form id="scheduler-form" class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">采集间隔</label>
                                <div class="flex space-x-2">
                                    <input type="number" id="interval-input" min="1" max="1440" value="1"
                                           class="flex-1 py-2 px-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 disabled:bg-gray-100 disabled:text-gray-400 disabled:cursor-not-allowed disabled:border-gray-200">
                                    <select id="unit-select" class="py-2 px-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 disabled:bg-gray-100 disabled:text-gray-400 disabled:cursor-not-allowed disabled:border-gray-200">
                                        <option value="minutes">分钟</option>
                                        <option value="hours" selected>小时</option>
                                        <option value="days">天</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Control Button (toggles between start/stop) -->
                            <div class="pt-2">
                                <button type="button" id="toggle-btn"
                                        class="w-full bg-green-600 text-white py-2 px-4 rounded-lg hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 flex items-center justify-center space-x-2">
                                    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                    </svg>
                                    <span>启动</span>
                                </button>
                            </div>
                        </form>

                        <!-- Quick Presets -->
                        <div class="mt-6 pt-6 border-t border-gray-200">
                            <div class="text-sm text-gray-500 mb-3">快速设置</div>
                            <div class="grid grid-cols-3 gap-2">
                                <button type="button" class="preset-btn py-2 px-3 text-sm border border-gray-300 rounded-lg hover:bg-gray-50" data-interval="30" data-unit="minutes">
                                    30分钟
                                </button>
                                <button type="button" class="preset-btn py-2 px-3 text-sm border border-gray-300 rounded-lg hover:bg-gray-50" data-interval="1" data-unit="hours">
                                    1小时
                                </button>
                                <button type="button" class="preset-btn py-2 px-3 text-sm border border-gray-300 rounded-lg hover:bg-gray-50" data-interval="6" data-unit="hours">
                                    6小时
                                </button>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Tab 2: Tweet Collection Records -->
                <section id="tab-tweets" class="tab-panel hidden">
                    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                        <h2 class="text-lg font-semibold text-gray-900 mb-4 flex items-center">
                            <svg class="h-5 w-5 mr-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                            </svg>
                            推文采集结果
                        </h2>

                        <!-- Manual actions -->
                        <div class="flex space-x-3 mb-6">
                            <button type="button" id="login-btn"
                                    class="flex-1 py-2 px-4 border border-blue-300 text-blue-700 rounded-lg hover:bg-blue-50 flex items-center justify-center space-x-2">
                                🔑 登录 X
                            </button>
                            <button type="button" id="collect-now-btn"
                                    class="flex-1 py-2 px-4 border border-green-300 text-green-700 rounded-lg hover:bg-green-50 flex items-center justify-center space-x-2">
                                📥 手动抓取Tweet
                            </button>
                            <button type="button" id="score-tweets-btn"
                                    class="flex-1 py-2 px-4 border border-amber-300 text-amber-700 rounded-lg hover:bg-amber-50 flex items-center justify-center space-x-2">
                                🤖 AI评分Tweet
                            </button>
                        </div>

                        <div id="collections-container" class="text-sm text-gray-500">加载中...</div>

                        <h3 class="text-sm font-semibold text-gray-900 mt-6 mb-2 flex items-center">
                            未打分推文
                            <span id="unscored-count" class="ml-2 px-2 py-0.5 text-xs bg-amber-100 text-amber-700 rounded-full">0</span>
                        </h3>
                        <div id="unscored-container" class="text-sm text-gray-500">加载中...</div>
                    </div>
                </section>

                <!-- Tab 3: News Collection Records -->
                <section id="tab-news" class="tab-panel hidden">
                    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                        <h2 class="text-lg font-semibold text-gray-900 mb-4 flex items-center justify-between">
                            <span class="flex items-center">
                                <svg class="h-5 w-5 mr-2 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path>
                                </svg>
                                新闻采集
                            </span>
                            <a href="/news" class="text-sm font-medium text-blue-600 hover:text-blue-800">新闻雷达 →</a>
                        </h2>

                        <!-- Manual actions -->
                        <div class="flex space-x-3 mb-6">
                            <button type="button" id="news-now-btn"
                                    class="flex-1 py-2 px-4 border border-purple-300 text-purple-700 rounded-lg hover:bg-purple-50 flex items-center justify-center space-x-2">
                                📡 手动抓取新闻
                            </button>
                            <button type="button" id="score-news-btn"
                                    class="flex-1 py-2 px-4 border border-amber-300 text-amber-700 rounded-lg hover:bg-amber-50 flex items-center justify-center space-x-2">
                                🤖 AI评分新闻
                            </button>
                        </div>

                        <div id="news-runs-container" class="text-sm text-gray-500">加载中...</div>

                        <h3 class="text-sm font-semibold text-gray-900 mt-6 mb-2">最近评分</h3>
                        <div id="news-items-container" class="text-sm text-gray-500">加载中...</div>
                    </div>
                </section>

                <!-- Tab 4: System Config -->
                <section id="tab-config" class="tab-panel hidden">
                    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 max-w-xl">
                        <h2 class="text-lg font-semibold text-gray-900 mb-4 flex items-center">
                            <svg class="h-5 w-5 mr-2 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            </svg>
                            系统配置
                        </h2>
                        <p class="text-xs text-gray-400 mb-4">
                            保存在 <code id="env-file-path" class="text-xs">.env</code>，保存后立即生效（无需重启）
                        </p>

                        <form id="config-form" class="space-y-4">
                            <!-- DeepSeek -->
                            <div class="pt-2 border-t border-gray-100">
                                <div class="text-sm font-semibold text-gray-700 mb-3">DeepSeek AI</div>
                                <div class="space-y-3">
                                    <div>
                                        <label class="block text-sm text-gray-600 mb-1">API Key</label>
                                        <div class="flex space-x-2">
                                            <input type="password" id="api-key-input" placeholder="sk-..."
                                                   class="flex-1 py-2 px-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm">
                                            <button type="button" id="api-key-toggle" class="px-3 border border-gray-300 rounded-lg text-sm text-gray-600 hover:bg-gray-50">显示</button>
                                        </div>
                                    </div>
                                    <div>
                                        <label class="block text-sm text-gray-600 mb-1">Base URL</label>
                                        <input type="text" id="base-url-input"
                                               class="w-full py-2 px-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm">
                                    </div>
                                    <div>
                                        <label class="block text-sm text-gray-600 mb-1">Model</label>
                                        <input type="text" id="model-input"
                                               class="w-full py-2 px-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm">
                                    </div>
                                </div>
                            </div>

                            <!-- WeChat Push -->
                            <div class="pt-2 border-t border-gray-100">
                                <div class="text-sm font-semibold text-gray-700 mb-3">微信推送</div>
                                <div class="space-y-3">
                                    <div>
                                        <label class="block text-sm text-gray-600 mb-1">推送渠道</label>
                                        <select id="push-provider-select"
                                                class="w-full py-2 px-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm">
                                            <option value="">关闭</option>
                                            <option value="serverchan">Server酱</option>
                                            <option value="pushplus">PushPlus</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-sm text-gray-600 mb-1">Token / SendKey</label>
                                        <input type="password" id="push-token-input"
                                               class="w-full py-2 px-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm">
                                    </div>
                                </div>
                            </div>

                            <!-- RSS -->
                            <div class="pt-2 border-t border-gray-100">
                                <div class="text-sm font-semibold text-gray-700 mb-3">RSS 订阅源</div>
                                <textarea id="rss-feeds-input" rows="3"
                                          placeholder="多个源用英文逗号分隔"
                                          class="w-full py-2 px-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm"></textarea>
                            </div>

                            <!-- AI toggles -->
                            <div class="pt-2 border-t border-gray-100">
                                <div class="text-sm font-semibold text-gray-700 mb-3">AI 功能开关</div>
                                <label class="flex items-center mb-2">
                                    <input type="checkbox" id="ai-filter-toggle" class="mr-2">
                                    <span class="text-sm text-gray-600">采集时 AI 过滤（垃圾推文不入库）</span>
                                </label>
                                <label class="flex items-center">
                                    <input type="checkbox" id="ai-summary-toggle" class="mr-2">
                                    <span class="text-sm text-gray-600">英文推文自动中文摘要</span>
                                </label>
                            </div>

                            <button type="button" id="save-config-btn"
                                    class="w-full bg-blue-600 text-white py-2 px-4 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                                保存配置
                            </button>
                        </form>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-4 right-4 transform translate-y-20 opacity-0 transition-all duration-300 z-50">
        <div class="bg-gray-800 text-white px-6 py-3 rounded-lg shadow-lg flex items-center space-x-2">
            <span id="toast-message">操作成功</span>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/scheduler.js') }}"></script>
</body>
</html>
